name: Detoxmate Prod CI/CD

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      build_only:
        description: Build and verify the production JAR without deploying
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: detoxmate-prod-deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install the pinned Temurin JDK
        run: |
          version=$(cat .java-version)
          bash infra/gcp/install-temurin.sh "$version" "$RUNNER_TEMP/temurin"
          echo "JAVA_HOME=$RUNNER_TEMP/temurin/$version" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/temurin/$version/bin" >> "$GITHUB_PATH"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build production JAR
        run: |
          runtime=$(java -XshowSettings:properties -version 2>&1 | sed -n 's/^ *java.runtime.version = //p')
          test "${runtime%-LTS}" = "$(cat .java-version)"
          chmod +x ./gradlew
          ./gradlew clean bootJar
      - name: Store executable JAR
        uses: actions/upload-artifact@v4
        with:
          name: detoxmate-jar
          path: |
            build/libs/*.jar
            !build/libs/*-plain.jar
          if-no-files-found: error
          retention-days: 1

  deploy:
    if: >-
      !inputs.build_only &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/codex/gcp-prod-migration-20261122')
    needs: build
    runs-on: ubuntu-latest
    environment: prod
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: detoxmate-jar
          path: build/libs
      - uses: google-github-actions/auth@v3
        with:
          project_id: project-1576008a-4268-49f3-bed
          workload_identity_provider: projects/1099126665271/locations/global/workloadIdentityPools/detoxmate-github/providers/prod
          service_account: detoxmate-release@project-1576008a-4268-49f3-bed.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v3
      - name: Upload JAR and restart systemd over IAP
        env:
          GCP_PROJECT: project-1576008a-4268-49f3-bed
          GCP_ZONE: us-central1-f
          GCP_VM: detoxmate-api
          GCP_SSH_HOST_KEY: ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAINk+Zsuy8ApYu8P7Avh+jKyg/jwdZk2oDA6o0duWWz8L
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          JWT_ACCESS_TOKEN_EXPIRES_IN: ${{ secrets.JWT_ACCESS_TOKEN_EXPIRES_IN }}
          ADMIN_REVIEW_TOKEN: ${{ secrets.ADMIN_REVIEW_TOKEN }}
          DISCORD_OCR_REPORT_WEBHOOK_URL: ${{ secrets.DISCORD_OCR_REPORT_WEBHOOK_URL }}
          APPLE_CLIENT_ID: ${{ vars.APPLE_CLIENT_ID }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          APPLE_KEY_ID: ${{ vars.APPLE_KEY_ID }}
          APPLE_PRIVATE_KEY: ${{ secrets.APPLE_PRIVATE_KEY }}
          KAKAO_ADMIN_KEY: ${{ secrets.KAKAO_ADMIN_KEY }}
          PROVIDER_TOKEN_ENCRYPTION_KEY: ${{ secrets.PROVIDER_TOKEN_ENCRYPTION_KEY }}
          APP_PUBLIC_BASE_URL: ${{ vars.APP_PUBLIC_BASE_URL }}
          STORAGE_IMAGE_READ_BASE_URL: ${{ vars.STORAGE_IMAGE_READ_BASE_URL }}
          S3_BUCKET_NAME: ${{ vars.S3_BUCKET_NAME }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          S3_PRESIGNED_URL_EXPIRES_IN: ${{ vars.S3_PRESIGNED_URL_EXPIRES_IN }}
        run: bash infra/gcp/deploy-jar.sh
