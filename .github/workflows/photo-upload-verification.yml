name: Photo upload verification
on:
  push:
    branches: [fix/gcp-photo-uploads]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Upload tests
        run: ./gradlew test --tests 'com.detoxmate.upload.*'
      - name: All tests and clean build
        run: |
          ./gradlew test
          ./gradlew clean build
