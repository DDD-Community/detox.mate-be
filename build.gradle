buildscript {
    repositories {
        mavenCentral()
        maven {
            url 'https://plugins.gradle.org/m2/'
        }
    }
    dependencies {
        classpath 'com.epages:restdocs-api-spec-gradle-plugin:0.20.0'
        classpath 'org.springframework.boot:spring-boot-jackson2:4.0.1'
    }
}

plugins {
    id 'java'
    id 'org.springframework.boot' version '4.0.5'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'org.asciidoctor.jvm.convert' version '4.0.5'
}

apply plugin: 'com.epages.restdocs-api-spec'

group = 'com'
version = '0.0.1-SNAPSHOT'
description = 'detoxmate'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

configurations {
    asciidoctorExt
}

ext {
    snippetsDir = file('build/generated-snippets')
}

asciidoctorj {
    version = '3.0.0'
}

dependencies {
    asciidoctorExt 'org.springframework.restdocs:spring-restdocs-asciidoctor:4.0.0'
    implementation platform('software.amazon.awssdk:bom:2.42.41')

    // Web
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.0.2'
    implementation 'org.springframework.security:spring-security-oauth2-jose'
    implementation 'org.springframework.security:spring-security-crypto'

    // Database
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-data-jdbc'
    runtimeOnly 'com.mysql:mysql-connector-j'

    // Monitoring
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'io.micrometer:micrometer-registry-prometheus'
    implementation 'io.jsonwebtoken:jjwt-api:0.13.0'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.13.0'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.13.0'

    //lombok
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    //firebase
    implementation 'com.google.firebase:firebase-admin:9.8.0'

    // aws
    implementation 'software.amazon.awssdk:s3'

    // Test
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
    testImplementation 'com.epages:restdocs-api-spec-mockmvc:0.20.0'
    testImplementation 'org.springframework.restdocs:spring-restdocs-mockmvc:4.0.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'
    testRuntimeOnly 'com.h2database:h2'
}

openapi3 {
    server = '/'
    title = 'Detoxmate API'
    description = 'Test-driven OpenAPI specification generated from Spring REST Docs'
    version = project.version.toString()
    format = 'yaml'
}

// REST Docs API Spec 0.20 emits scalar enums inline, including users inside array items.
tasks.matching { it.name == 'openapi3' }.configureEach {
    doLast {
        def specFile = layout.buildDirectory.file('api-spec/openapi3.yaml').get().asFile
        def mapper = io.swagger.v3.core.util.Yaml.mapper()
        def spec = mapper.readValue(specFile, Map)
        def schemas = spec.components.schemas
        def contract
        contract = { node ->
            if (node instanceof Map) {
                return node.findAll { key, value -> key != 'description' && key != 'title' }
                        .collectEntries { key, value -> [(key): contract(value)] }
            }
            node instanceof List ? node.collect { contract(it) } : node
        }
        [FriendUserResponse: ['FriendRequestResponse', 'FriendRequestResponseList'],
         FriendListUserResponse: ['FriendResponse', 'FriendResponseList', 'FriendReceivedRequestResponseList']].each { name, wrappers ->
            def canonical = schemas[name]
            wrappers.each { wrapper ->
                def container = schemas[wrapper]?.type == 'array' ? schemas[wrapper].items : schemas[wrapper]
                def user = container?.properties?.user
                def userRef = ['$ref': "#/components/schemas/${name}".toString()]
                if (user == userRef && canonical) return
                if (!(user instanceof Map) || user.type != 'object') {
                    throw new GradleException("Missing inline user schema in ${wrapper}")
                }
                if (canonical && contract(canonical) != contract(user)) {
                    throw new GradleException("Conflicting ${name} response contracts in ${wrapper}")
                }
                canonical = canonical ?: user
                container.properties.user = userRef
                // Nested descriptors do not make the containing object required in API Spec 0.20.
                if (name == 'FriendListUserResponse') {
                    container.required = ((container.required ?: []) + ['user']).unique().sort()
                }
            }
            schemas[name] = canonical
        }
        def statusRef = ['$ref': '#/components/schemas/FriendRelationshipStatus']
        def status = schemas.FriendSearchResponse.properties.relationshipStatus
        def commonStatus = status == statusRef ? schemas.FriendRelationshipStatus : status
        if (commonStatus?.type != 'string' || !(commonStatus.enum instanceof List) || commonStatus.enum.isEmpty()) {
            throw new GradleException('Missing documented friend relationship enum')
        }
        ['FriendSearchResponse', 'FriendUserResponse', 'FriendListUserResponse', 'FriendInviteeResponse', 'FriendProfileResponse'].each { name ->
            def field = schemas[name]?.properties?.relationshipStatus
            if (field != statusRef && field != commonStatus) {
                throw new GradleException("Conflicting relationshipStatus contract in ${name}")
            }
            schemas[name].properties.relationshipStatus = statusRef
        }
        schemas.FriendRelationshipStatus = commonStatus
        // REST Docs API Spec couples nullable to optional; these response keys are always present.
        [MyPageResponse: ['profileImageUrl'],
         FriendListUserResponse: ['profileImageUrl', 'requestId']].each { name, nullableFields ->
            def schema = schemas[name]
            nullableFields.each { field ->
                if (schema?.properties?.get(field)?.nullable != true) {
                    throw new GradleException("${name}.${field} must be documented as nullable")
                }
            }
            schema.required = ((schema.required ?: []) + nullableFields).unique().sort()
        }
        mapper.writeValue(specFile, spec)
    }
}

tasks.named('test') {
    useJUnitPlatform()
    doFirst {
        delete snippetsDir
    }
    outputs.dir snippetsDir
}

tasks.named('asciidoctor') {
    configurations 'asciidoctorExt'
    inputs.dir snippetsDir
    dependsOn tasks.named('test')
}

tasks.register('verifyFriendRelationshipSchema') {
    dependsOn 'openapi3'
    inputs.file(layout.buildDirectory.file('api-spec/openapi3.yaml'))
    doLast {
        def spec = io.swagger.v3.core.util.Yaml.mapper().readValue(inputs.files.singleFile, Map)
        def schemas = spec.components.schemas
        def status = schemas.FriendRelationshipStatus
        if (status?.type != 'string' || !(status.enum instanceof List) || status.enum.isEmpty()) {
            throw new GradleException('OpenAPI must define the FriendRelationshipStatus string enum once')
        }
        def statusRef = ['$ref': '#/components/schemas/FriendRelationshipStatus']
        ['FriendSearchResponse', 'FriendUserResponse', 'FriendListUserResponse', 'FriendInviteeResponse', 'FriendProfileResponse'].each { name ->
            if (schemas[name]?.properties?.relationshipStatus != statusRef) {
                throw new GradleException("${name}.relationshipStatus must reference FriendRelationshipStatus")
            }
        }
        def enumDefinitions = 0
        def inspect
        inspect = { node ->
            if (node instanceof Map) {
                if (node.enum == status.enum) enumDefinitions++
                if (node.properties?.relationshipStatus && node.properties.relationshipStatus != statusRef) {
                    throw new GradleException('OpenAPI still contains an inline relationshipStatus schema')
                }
                node.values().each { inspect(it) }
            } else if (node instanceof List) {
                node.each { inspect(it) }
            }
        }
        inspect(schemas)
        if (enumDefinitions != 1) {
            throw new GradleException("Expected one friend relationship enum definition, found ${enumDefinitions}")
        }
    }
}

tasks.register('verifyFriendInviteResponseSchemas') {
    dependsOn 'openapi3'
    inputs.file(layout.buildDirectory.file('api-spec/openapi3.yaml'))
    doLast {
        def schemas = io.swagger.v3.core.util.Yaml.mapper()
                .readValue(inputs.files.singleFile, Map).components.schemas
        [MyPageResponse: ['id', 'displayName', 'userCode', 'profileImageUrl', 'pushNotificationEnabled'],
         FriendListUserResponse: ['userId', 'displayName', 'userCode', 'profileImageUrl', 'relationshipStatus', 'requestId'],
         FriendInviteResponse: ['code', 'userCode']].each { name, fields ->
            def schema = schemas[name]
            if (schema?.properties?.keySet() != fields.toSet()
                    || (schema?.required ?: []).toSet() != fields.toSet()) {
                throw new GradleException("${name} must expose exactly the required response fields: ${fields}")
            }
            fields.each { field ->
                def nullable = field in ['profileImageUrl', 'requestId']
                if ((schema.properties[field].nullable == true) != nullable) {
                    throw new GradleException("${name}.${field} nullable must be ${nullable}")
                }
            }
        }
        [FriendResponse: ['friendshipId', 'user', 'acceptedAt'],
         FriendResponseList: ['friendshipId', 'user', 'acceptedAt'],
         FriendReceivedRequestResponseList: ['requestId', 'user', 'createdAt']].each { name, fields ->
            def schema = schemas[name]?.type == 'array' ? schemas[name].items : schemas[name]
            if (schema?.properties?.keySet() != fields.toSet()
                    || (schema?.required ?: []).toSet() != fields.toSet()
                    || schema.properties.values().any { it.nullable == true }) {
                throw new GradleException("${name} must expose required, non-null response wrapper fields: ${fields}")
            }
        }
    }
}

tasks.register('copyOpenapi3Spec', Copy) {
    dependsOn 'verifyFriendRelationshipSchema', 'verifyFriendInviteResponseSchemas'
    from(layout.buildDirectory.file('api-spec/openapi3.yaml'))
    into(layout.buildDirectory.dir('resources/main/static'))
}

tasks.named('bootRun') {
    dependsOn tasks.named('copyOpenapi3Spec')
}

tasks.named('bootJar') {
    dependsOn tasks.named('copyOpenapi3Spec')
    exclude 'firebase/**'
}

tasks.named('jar') {
    dependsOn tasks.named('copyOpenapi3Spec')
    exclude 'firebase/**'
}

tasks.named('resolveMainClassName') {
    dependsOn tasks.named('copyOpenapi3Spec')
}
